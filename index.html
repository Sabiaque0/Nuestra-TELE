<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Checker & Player</title>
    <!-- Librería HLS.js para reproducción de streams M3U8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #00adb5;
            --text: #eeeeee;
            --text-dim: #b0b0b0;
            --success: #2ec4b6;
            --error: #e63946;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1, h2 {
            margin: 0 0 10px 0;
            color: var(--accent);
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        textarea {
            width: 100%;
            height: 150px;
            background-color: #2a2a2a;
            color: var(--text);
            border: 1px solid #444;
            border-radius: 4px;
            padding: 10px;
            box-sizing: border-box;
            font-family: monospace;
            resize: vertical;
        }

        button {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }

        label {
            font-size: 0.9em;
            color: var(--text-dim);
        }

        input[type="checkbox"] {
            accent-color: var(--accent);
        }

        video {
            width: 100%;
            max-height: 360px;
            background-color: #000;
            border-radius: 4px;
        }

        .status-bar {
            margin-top: 10px;
            font-size: 0.9em;
            color: var(--text-dim);
        }

        .channel-list {
            max-height: 400px;
            overflow-y: auto;
            margin-top: 15px;
            border: 1px solid #333;
            border-radius: 4px;
        }

        .channel-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #2a2a2a;
            cursor: pointer;
            transition: background 0.2s;
        }

        .channel-item:hover {
            background-color: #2a2a2a;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge.online {
            background-color: rgba(46, 196, 182, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .badge.offline {
            background-color: rgba(230, 57, 70, 0.2);
            color: var(--error);
            border: 1px solid var(--error);
        }

        .badge.checking {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--text-dim);
        }
    </style>
</head>
<body>

    <h1>Verificador y Reproductor IPTV</h1>

    <div class="container">
        <!-- Panel Izquierdo: Entrada de Lista y Verificación -->
        <div class="panel">
            <h2>1. Pega tu lista M3U / M3U8</h2>
            <textarea id="playlistInput" placeholder="#EXTM3U&#10;#EXTINF:-1, Canal Ejemplo&#10;http://servidor.com/live/stream.m3u8"></textarea>
            
            <div class="controls">
                <input type="checkbox" id="useCorsProxy">
                <label for="useCorsProxy">Usar proxy CORS (Recomendado si falla la verificación)</label>
            </div>

            <button id="btnProcess" onclick="processPlaylist()">Cargar y Verificar Canales</button>
            
            <div class="status-bar" id="statusBar">Esperando lista...</div>

            <h2>2. Canales Activos (Ordenados A-Z)</h2>
            <div class="channel-list" id="channelList">
                <div style="padding: 15px; text-align: center; color: var(--text-dim);">
                    Carga una lista para mostrar los canales
                </div>
            </div>
        </div>

        <!-- Panel Derecho: Reproductor -->
        <div class="panel">
            <h2>3. Reproductor</h2>
            <video id="videoPlayer" controls autoplay></video>
            <h3 id="currentChannelTitle" style="margin-top: 15px; color: var(--text-dim);">Selecciona un canal para reproducir</h3>
        </div>
    </div>

    <script>
        let channels = [];
        const corsProxy = "https://corsproxy.io/?"; // Proxy público para evadir bloqueos CORS

        // Parsear el texto M3U en un array de objetos { name, url }
        function parseM3U(content) {
            const lines = content.split('\n');
            const result = [];
            let currentName = 'Canal sin nombre';

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                
                if (line.startsWith('#EXTINF:')) {
                    const commaIndex = line.indexOf(',');
                    if (commaIndex !== -1) {
                        currentName = line.substring(commaIndex + 1).trim();
                    }
                } else if (line.length > 0 && !line.startsWith('#')) {
                    result.push({
                        name: currentName,
                        url: line,
                        status: 'checking' // checking, online, offline
                    });
                    currentName = 'Canal sin nombre';
                }
            }

            // Ordenar alfabéticamente por nombre
            return result.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
        }

        // Procesar e iniciar verificación
        async function processPlaylist() {
            const rawText = document.getElementById('playlistInput').value;
            if (!rawText.trim()) {
                alert("Por favor pega el contenido de una lista IPTV (.m3u)");
                return;
            }

            document.getElementById('btnProcess').disabled = true;
            channels = parseM3U(rawText);
            
            renderChannelList();
            
            const useProxy = document.getElementById('useCorsProxy').checked;
            let onlineCount = 0;

            for (let i = 0; i < channels.length; i++) {
                updateStatus(`Verificando canal ${i + 1} de ${channels.length}...`);
                const isWorking = await checkStreamUrl(channels[i].url, useProxy);
                
                channels[i].status = isWorking ? 'online' : 'offline';
                if (isWorking) onlineCount++;
                
                renderChannelList();
            }

            updateStatus(`Verificación completada. ${onlineCount} de ${channels.length} canales activos.`);
            document.getElementById('btnProcess').disabled = false;
        }

        // Verificar si la URL responde
        async function checkStreamUrl(url, useProxy) {
            const targetUrl = useProxy ? corsProxy + encodeURIComponent(url) : url;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000); // 5 segundos de timeout

            try {
                // Se realiza una petición FETCH ligera (GET/HEAD)
                const response = await fetch(targetUrl, {
                    method: 'GET',
                    signal: controller.signal,
                    headers: { 'Range': 'bytes=0-100' } // Cargar solo los primeros bytes
                });
                clearTimeout(timeoutId);
                return response.ok;
            } catch (err) {
                clearTimeout(timeoutId);
                return false;
            }
        }

        // Actualizar la interfaz con la lista de canales
        function renderChannelList() {
            const listContainer = document.getElementById('channelList');
            listContainer.innerHTML = '';

            if (channels.length === 0) {
                listContainer.innerHTML = '<div style="padding: 15px; text-align: center; color: var(--text-dim);">No se encontraron canales válidos.</div>';
                return;
            }

            channels.forEach((channel, index) => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                
                let badgeClass = channel.status;
                let badgeText = channel.status === 'online' ? 'Activo' : (channel.status === 'offline' ? 'Caído' : 'Probando...');

                item.innerHTML = `
                    <span><strong>${channel.name}</strong></span>
                    <span class="badge ${badgeClass}">${badgeText}</span>
                `;

                // Solo permitir clic si el canal está activo o en verificación
                if (channel.status !== 'offline') {
                    item.onclick = () => playStream(channel.url, channel.name);
                }

                listContainer.appendChild(item);
            });
        }

        // Reproducir el flujo HLS
        function playStream(url, name) {
            const video = document.getElementById('videoPlayer');
            const title = document.getElementById('currentChannelTitle');
            
            title.innerText = `Reproduciendo: ${name}`;

            if (Hls.isSupported()) {
                const hls = new Hls({
                    manifestLoadingTimeOut: 10000,
                    manifestLoadingMaxRetry: 2
                });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(() => {});
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Soporte nativo para Safari/iOS
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play().catch(() => {});
                });
            } else {
                alert("Tu navegador no soporta la reproducción de flujos HLS (.m3u8).");
            }
        }

        function updateStatus(msg) {
            document.getElementById('statusBar').innerText = msg;
        }
    </script>
</body>
</html>
