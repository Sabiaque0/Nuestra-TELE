<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart TV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #0084ff;
      --text: #ffffff;
      --success: #2ec4b6;
      --error: #e63946;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 900px;
    }
    .video-box {
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    video {
      width: 100%;
      height: auto;
      max-height: 450px;
      display: block;
    }
    .controls-panel {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    textarea {
      width: 100%;
      height: 60px;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 8px;
      padding: 8px;
      box-sizing: border-box;
      resize: vertical;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }
    .card {
      background: var(--card-bg);
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
    }
    .card:hover, .card.active {
      border-color: var(--accent);
      background: #282828;
    }
    .card img {
      max-width: 100%;
      height: 50px;
      object-fit: contain;
      margin-bottom: 5px;
    }
    #status {
      margin-top: 10px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="video-box">
    <video id="videoPlayer" controls autoplay></video>
  </div>

  <div class="controls-panel">
    <textarea id="m3uInput" placeholder="Pega aquí la URL de tu lista (.m3u/.m3u8) o el texto M3U..."></textarea>
    <div class="btn-row">
      <button onclick="procesarEntrada()">Cargar / Verificar</button>
      <label><input type="checkbox" id="useProxy"> Usar Proxy CORS</label>
    </div>
    <div id="status"></div>
  </div>

  <div class="grid" id="channelsGrid"></div>
</div>

<script>
  let hls = null;

  window.onload = () => {
    const saved = localStorage.getItem('guardado_m3u');
    if (saved) {
      document.getElementById('m3uInput').value = saved;
      procesarEntrada();
    }
  };

  function reproducirURL(url) {
    const video = document.getElementById('videoPlayer');

    if (hls) {
      hls.destroy();
    }

    if (Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        video.play();
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.addEventListener('loadedmetadata', function() {
        video.play();
      });
    } else {
      alert("Tu navegador o dispositivo no soporta la reproducción de video HLS.");
    }
  }

  async function procesarEntrada() {
    const input = document.getElementById('m3uInput').value.trim();
    const usarProxy = document.getElementById('useProxy').checked;
    const statusDiv = document.getElementById('status');
    const grid = document.getElementById('channelsGrid');

    if (!input) {
      statusDiv.innerHTML = "<b style='color:var(--error)'>Pega una URL o lista en el cuadro.</b>";
      return;
    }

    localStorage.setItem('guardado_m3u', input);

    // Si es un enlace m3u8 directo reproducir directamente
    if (input.endsWith('.m3u8') && !input.includes('\n')) {
      statusDiv.innerHTML = "<b style='color:var(--success)'>Reproduciendo señal directa M3U8...</b>";
      reproducirURL(input);
      grid.innerHTML = '';
      return;
    }

    statusDiv.innerHTML = "Cargando datos...";

    let textoM3U = input;

    if (input.startsWith('http://') || input.startsWith('https://')) {
      let finalUrl = input;
      if (usarProxy) {
        finalUrl = https://api.allorigins.win/raw?url=${encodeURIComponent(input)};
      }
      try {
        const res = await fetch(finalUrl);
        if (!res.ok) throw new Error("Error en la descarga");
        textoM3U = await res.text();
      } catch (e) {
        statusDiv.innerHTML = <b style='color:var(--error)'>Error al descargar enlace M3U. Prueba a activar/desactivar la casilla Proxy CORS.</b>;
        return;
      }
    }

    const canales = parsearM3U(textoM3U);
    if (canales.length === 0) {
      statusDiv.innerHTML = "<b style='color:var(--error)'>No se detectaron canales en el contenido.</b>";
      return;
    }

    statusDiv.innerHTML = <b style='color:var(--success)'>¡${canales.length} canal(es) cargado(s)! Haz clic en uno para ver.</b>;
    renderizarCanales(canales);

    // Auto reproducir el primero
    reproducirURL(canales[0].url);
  }

  function parsearM3U(texto) {
    const lineas = texto.split('\n');
    const canales = [];
    let canalActual = null;

    for (let l of lineas) {
      l = l.trim();
      if (l.startsWith('#EXTINF:')) {
        const partes = l.split(',');
        const nombre = partes.length > 1 ? partes.slice(1).join(',') : 'Canal';
        const logoMatch = l.match(/tvg-logo="([^"]+)"/);
        const logo = logoMatch ? logoMatch[1] : '';
        canalActual = { nombre, logo };
      } else if (l && !l.startsWith('#') && canalActual) {
        canalActual.url = l;
        canales.push(canalActual);
        canalActual = null;
      }
    }
    return canales;
  }

  function renderizarCanales(canales) {
    const grid = document.getElementById('channelsGrid');
    grid.innerHTML = '';

    canales.forEach((canal, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      if (index === 0) card.classList.add('active');

      card.onclick = () => {
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        reproducirURL(canal.url);
      };

      if (canal.logo) {
        const img = document.createElement('img');
        img.src = canal.logo;
        img.onerror = () => img.remove();
        card.appendChild(img);
      }

      const txt = document.createElement('div');
      txt.innerText = canal.nombre;
      card.appendChild(txt);

      grid.appendChild(card);
    });
  }
</script>

</body>
</html>
