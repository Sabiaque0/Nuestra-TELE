<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Player TV Style</title>
    <!-- Librería HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-main: #0f1015;
            --bg-card: #1a1c23;
            --bg-card-hover: #252836;
            --accent: #00e5ff;
            --accent-glow: rgba(0, 229, 255, 0.3);
            --text-main: #ffffff;
            --text-sub: #a0a5b5;
            --success: #00e676;
            --error: #ff5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- SECCIÓN REPRODUCTOR (TOP) --- */
        .player-section {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #2a2d3d;
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .now-playing {
            margin-top: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- SECCIÓN ENTRADA Y CONTROLES --- */
        .input-section {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #2a2d3d;
        }

        textarea {
            width: 100%;
            height: 100px;
            background-color: #121319;
            color: var(--text-main);
            border: 2px solid #2a2d3d;
            border-radius: 10px;
            padding: 12px;
            font-size: 0.95rem;
            font-family: monospace;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .controls-bar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #121319;
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
        }

        .toggle-container input {
            width: 22px;
            height: 22px;
            accent-color: var(--accent);
        }

        .btn-large {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 180, 219, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-large:active {
            transform: scale(0.98);
        }

        .btn-large:disabled {
            background: #2a2d3d;
            color: var(--text-sub);
            box-shadow: none;
        }

        .status-text {
            font-size: 0.9rem;
            color: var(--text-sub);
            text-align: center;
            margin-top: 8px;
        }

        /* --- REJILLA DE CANALES ESTILO TV --- */
        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* Estilo tarjeta de canal */
        .channel-card {
            background-color: var(--bg-card);
            border: 2px solid #2a2d3d;
            border-radius: 14px;
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: 100px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            position: relative;
        }

        .channel-card:hover, .channel-card:focus {
            border-color: var(--accent);
            background-color: var(--bg-card-hover);
            box-shadow: 0 0 15px var(--accent-glow);
            transform: translateY(-2px);
        }

        .channel-name {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.2;
            word-break: break-word;
        }

        /* Estado indicator */
        .status-pill {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .status-pill.online {
            background-color: rgba(0, 230, 118, 0.15);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .status-pill.offline {
            background-color: rgba(255, 82, 82, 0.15);
            color: var(--error);
            border: 1px solid var(--error);
        }

        .status-pill.checking {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <!-- Reproductor Superior -->
    <div class="player-section">
        <div class="video-container">
            <video id="videoPlayer" controls autoplay></video>
        </div>
        <div class="now-playing" id="currentChannelTitle">Selecciona un canal para reproducir</div>
    </div>

    <!-- Panel de Entrada de Lista -->
    <div class="input-section">
        <textarea id="playlistInput" placeholder="Pega tu lista M3U aquí..."></textarea>
        
        <div class="controls-bar">
            <label class="toggle-container">
                <input type="checkbox" id="useCorsProxy" checked>
                <span>Usar proxy CORS (Recomendado)</span>
            </label>

            <button class="btn-large" id="btnProcess" onclick="processPlaylist()">Verificar Canales</button>
        </div>
        <div class="status-text" id="statusBar">Esperando lista IPTV...</div>
    </div>

    <!-- Rejilla de Canales Estilo Smart TV -->
    <div>
        <div class="section-title">
            <span>Canales Activos</span>
            <span id="channelCount" style="font-size: 0.9rem; color: var(--text-sub);">0 canales</span>
        </div>
        <div class="channels-grid" id="channelGrid">
            <div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 30px;">
                Carga tu lista para mostrar las tarjetas de canales
            </div>
        </div>
    </div>

    <script>
        let channels = [];
        const corsProxy = "https://corsproxy.io/?";

        function parseM3U(content) {
            const lines = content.split('\n');
            const result = [];
            let currentName = 'Canal sin nombre';

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                
                if (line.startsWith('#EXTINF:')) {
                    const commaIndex = line.indexOf(',');
                    if (commaIndex !== -1) {
                        currentName = line.substring(commaIndex + 1).trim();
                    }
                } else if (line.length > 0 && !line.startsWith('#')) {
                    result.push({
                        name: currentName,
                        url: line,
                        status: 'checking'
                    });
                    currentName = 'Canal sin nombre';
                }
            }

            return result.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
        }

        async function processPlaylist() {
            const rawText = document.getElementById('playlistInput').value;
            if (!rawText.trim()) {
                alert("Por favor pega una lista IPTV válida.");
                return;
            }

            document.getElementById('btnProcess').disabled = true;
            channels = parseM3U(rawText);
            
            document.getElementById('channelCount').innerText = `${channels.length} canales`;
            renderGrid();
            
            const useProxy = document.getElementById('useCorsProxy').checked;
            let onlineCount = 0;

            for (let i = 0; i < channels.length; i++) {
                updateStatus(`Verificando ${i + 1} / ${channels.length}...`);
                const isWorking = await checkStreamUrl(channels[i].url, useProxy);
                
                channels[i].status = isWorking ? 'online' : 'offline';
                if (isWorking) onlineCount++;
                
                renderGrid();
            }

            updateStatus(`Listo. ${onlineCount} de ${channels.length} canales funcionando.`);
            document.getElementById('btnProcess').disabled = false;
        }

        async function checkStreamUrl(url, useProxy) {
            const targetUrl = useProxy ? corsProxy + encodeURIComponent(url) : url;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 4000);

            try {
                const response = await fetch(targetUrl, {
                    method: 'GET',
                    signal: controller.signal,
                    headers: { 'Range': 'bytes=0-100' }
                });
                clearTimeout(timeoutId);
                return response.ok;
            } catch (err) {
                clearTimeout(timeoutId);
                return false;
            }
        }

        function renderGrid() {
            const grid = document.getElementById('channelGrid');
            grid.innerHTML = '';

            if (channels.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 30px;">No se encontraron canales.</div>';
                return;
            }

            channels.forEach((channel) => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                
                let badgeClass = channel.status;
                let badgeText = channel.status === 'online' ? 'Activo' : (channel.status === 'offline' ? 'Caído' : '...');

                card.innerHTML = `
                    <div class="channel-name">${channel.name}</div>
                    <span class="status-pill ${badgeClass}">${badgeText}</span>
                `;

                if (channel.status !== 'offline') {
                    card.onclick = () => playStream(channel.url, channel.name);
                } else {
                    card.style.opacity = '0.5';
                    card.style.cursor = 'not-allowed';
                }

                grid.appendChild(card);
            });
        }

        function playStream(url, name) {
            const video = document.getElementById('videoPlayer');
            const title = document.getElementById('currentChannelTitle');
            
            title.innerText = ` ▶ ${name}`;
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(() => {});
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play().catch(() => {});
                });
            }
        }

        function updateStatus(msg) {
            document.getElementById('statusBar').innerText = msg;
        }
    </script>
</body>
</html>
